<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>The Demons' Wager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Spectral:ital,wght@0,400;0,600;1,400&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: one screen at a time, like the pages of a grimoire; the hunt board is a three-column altar (Humans | tokens + deals | Vampires) sized for a TV. Single dark look, by choice. */
:root{
  --night:#0d0b11; --crypt:#17141d; --stone:#241f2c; --edge:#3a3344;
  --bone:#ece4d1; --ash:#a49cab; --parch:#e6d7b4; --ink:#2a1d14; --sepia:#7a5530; --wine:#8b1424;
  --candle:#e2aa4c; --candle-dim:rgba(226,170,76,.16); --blood:#c4203a; --blood-dim:rgba(196,32,58,.18);
  --ember:#e8692a; --moss:#88a964;
  --f-display:'Pirata One','UnifrakturMaguntia',Georgia,serif;
  --f-body:'Spectral',Georgia,'Times New Roman',serif;
  --f-label:'IM Fell English SC',Georgia,serif;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--bone);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--candle);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.label{font-family:var(--f-label);letter-spacing:.06em;color:var(--ash);font-size:.9rem}
.screen{max-width:1500px;margin:0 auto;padding-block:20px 48px}
.btn{background:var(--stone);border:1px solid var(--edge);border-radius:999px;padding:.55em 1.2em;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ash)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#1a0d05;font-weight:600}
.btn.primary:hover{background:#f07a3c}
.btn.ghost{background:transparent}
.btn.small{padding:.3em .8em;font-size:.88rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hum{color:var(--candle)} .vam{color:var(--blood)}
input[type=text],input[type=password],input[type=number],select,textarea{background:var(--crypt);border:1px solid var(--edge);border-radius:8px;padding:.45em .7em;min-width:0}
textarea{width:100%;resize:vertical}

.gm-bar{position:fixed;top:env(safe-area-inset-top,0px);right:max(10px,env(safe-area-inset-right,0px));z-index:40;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;
  background:rgba(13,11,17,.78);backdrop-filter:blur(6px);border:1px solid var(--edge);border-radius:999px;padding:4px;margin-top:8px;opacity:.5;transition:opacity .2s}
.gm-bar:hover,.gm-bar:focus-within{opacity:1}
.gm-bar button{background:none;border:0;border-radius:999px;padding:.25em .7em;font-family:var(--f-label);font-size:.85rem;color:var(--ash)}
.gm-bar button[aria-current=true]{background:var(--stone);color:var(--bone)}
.gm-bar button:hover{color:var(--bone)}

/* LANDING */
#s-landing{max-width:none;padding:0;position:relative;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.land{position:relative;height:100vh;min-height:600px;overflow:hidden}
#gy,.land-bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.land-bg{object-fit:cover}
.land::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 70% 60% at 22% 22%,rgba(5,4,8,.82),rgba(5,4,8,0) 70%),linear-gradient(transparent 60%,rgba(5,4,8,.75))}
.land-title{position:absolute;z-index:2;left:max(6vw,24px);top:9vh;max-width:min(640px,82vw)}
.land-title .eyebrow{font-family:var(--f-label);letter-spacing:.32em;color:var(--candle);font-size:.95rem}
.land-title h1{font-size:clamp(3.4rem,8.5vw,7.4rem);line-height:.9;color:var(--bone);margin:10px 0 16px;
  text-shadow:0 3px 0 #000,0 0 50px rgba(0,0,0,.95),0 0 18px rgba(226,170,76,.25)}
.land-title p{font-size:clamp(1.05rem,1.6vw,1.3rem);color:var(--bone);max-width:34ch;margin:0;text-shadow:0 2px 12px #000}
.book{position:absolute;z-index:2;left:50%;bottom:4vh;transform:translateX(-50%);border:0;background:none;padding:0;display:flex;flex-direction:row;align-items:center;gap:18px;color:var(--bone)}
.book .cover{flex:none;width:60px;height:60px;border-radius:5px 8px 8px 5px;background:linear-gradient(135deg,#4a1820,#22080d);border:2px solid #6b3a26;position:relative;
  box-shadow:0 10px 24px rgba(0,0,0,.6);animation:bookglow 2.8s ease-in-out infinite;transition:transform .3s}
.book .cover::before{content:"";position:absolute;inset:6px;border:1px solid rgba(226,170,76,.5);border-radius:3px}
.book .cover svg{position:absolute;inset:0;margin:auto;width:30px;height:30px}
.book:hover .cover{transform:scale(1.08)}
.book .hint{font-family:var(--f-label);letter-spacing:.14em;text-shadow:0 2px 8px #000;background:rgba(5,4,8,.7);padding:.6em 1.6em;border-radius:999px;white-space:nowrap}
@keyframes bookglow{50%{box-shadow:0 0 60px 10px rgba(232,105,42,.45),0 18px 40px rgba(0,0,0,.6)}}

/* GRIMOIRE */
.grim{display:grid;grid-template-columns:1fr 1fr;max-width:1240px;height:min(70vh,760px);min-height:480px;margin:5vh auto 0;position:relative;perspective:2600px}
.pg{background:var(--parch);color:var(--ink);position:relative;overflow:hidden}
.pg.left{border-radius:8px 0 0 8px;box-shadow:inset -40px 0 50px -30px rgba(60,30,10,.45),inset 0 0 90px rgba(90,50,10,.3);padding:34px}
.pg.right{border-radius:0 8px 8px 0;box-shadow:inset 40px 0 50px -30px rgba(60,30,10,.45),inset 0 0 90px rgba(90,50,10,.3);padding:46px 52px;display:flex;flex-direction:column;justify-content:center}
.grim::before{content:"";position:absolute;inset:-10px -12px -14px;background:#2a1209;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.75);z-index:-1}
.illus{margin:0;height:100%;display:flex;align-items:center;justify-content:center}
.illus svg{width:100%;height:100%;max-height:100%}
.illus img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply;border-radius:4px}
.pg .folio{font-family:var(--f-label);letter-spacing:.2em;color:var(--sepia)}
.pg h2{font-size:clamp(2.2rem,3.6vw,3.4rem);line-height:1;color:#4a1018;margin:8px 0 18px}
.pg .text{font-size:clamp(1.1rem,1.6vw,1.45rem);line-height:1.6;max-width:36ch;margin:0}
.pg .text::first-letter{font-family:var(--f-display);float:left;font-size:4em;line-height:.8;padding:.08em .1em 0 0;color:var(--wine)}
.leaf{position:absolute;top:0;bottom:0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.45,.05,.25,1);z-index:5}
.leaf.fwd{transform-origin:left center}
.leaf.back{transform-origin:right center}
.leaf.fwd.go{transform:rotateY(-180deg)}
.leaf.back.go{transform:rotateY(180deg)}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .face.backf{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(40,20,5,.0),rgba(40,20,5,.35));opacity:0;transition:opacity 1s}
.leaf.go .face.front::after{opacity:1}
.grim-ctrl{max-width:1240px;margin:26px auto 0;justify-content:space-between}
.dots{display:flex;gap:8px}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--edge)}
.dots span.on{background:var(--candle)}
.speaking .grim::before{box-shadow:0 30px 80px rgba(0,0,0,.75),0 0 70px rgba(232,105,42,.4)}

/* crests and team banners */
.crest{width:64px;height:64px;flex:none}
.crest img,.crest svg{width:100%;height:100%;object-fit:contain}
.banner{display:flex;gap:14px;align-items:center}
.banner .motto{font-family:var(--f-label);letter-spacing:.08em;font-size:.9rem;color:var(--ash)}

/* RULES */
.rules-head{text-align:center;margin:4vh 0 28px}
.rules-head h1{font-size:clamp(2.6rem,5vw,4.4rem)}
.obj{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.obj > div{padding:24px 28px;border-radius:var(--r)}
.obj .humans{background:linear-gradient(160deg,var(--candle-dim),var(--crypt) 60%);border:1px solid rgba(226,170,76,.35)}
.obj .vampires{background:linear-gradient(160deg,var(--blood-dim),var(--crypt) 60%);border:1px solid rgba(196,32,58,.4)}
.obj h2{font-size:2.6rem;line-height:1}
.obj p{margin:12px 0 0}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.rules section{background:var(--crypt);border:1px solid var(--edge);border-radius:var(--r);padding:22px 24px}
.rules h3{font-size:1.8rem;margin-bottom:8px;color:var(--parch)}
.rules ul,.rules ol{margin:0;padding-left:1.2em}
.rules li{margin:.3em 0}
.outcome{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline;margin-top:14px}
.pips{white-space:nowrap}
.pip{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--moss);margin-right:3px;vertical-align:-1px}
.pip.c{background:var(--blood)}
.pip.t{background:var(--ember)}
.prices{grid-column:1/-1}
.price-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:6px}
.price-cols h4{font-family:var(--f-label);font-weight:400;letter-spacing:.1em;margin:0 0 8px;font-size:1rem}
.price{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-bottom:12px}
.price b{font-weight:600}
.price .pips{grid-row:span 2;padding-top:.25em}
.price span.d{color:var(--ash);font-size:.95rem}

/* SETUP */
.setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:28px;margin-top:4vh}
.panel{background:var(--crypt);border:1px solid var(--edge);border-radius:var(--r);padding:22px 24px}
.panel h2{font-size:2.2rem;margin-bottom:6px}
.namelist{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.namelist li{background:var(--stone);border-radius:999px;padding:.25em .4em .25em .9em;display:flex;gap:6px;align-items:center}
.namelist button{background:none;border:0;color:var(--ash);padding:0 .4em}
.roll-list{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.roll-list li{display:flex;justify-content:space-between;align-items:center;background:var(--stone);border-radius:8px;padding:.6em .9em;font-size:1.15rem}
.roll-list .res{font-family:var(--f-label);letter-spacing:.08em;min-width:6.5em;text-align:right}
.roll-list .res.spin{animation:flick .12s steps(1) infinite}
@keyframes flick{50%{opacity:.4}}

/* BOARD */
.board-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 18px;padding-right:360px}
.board-top h1{font-size:clamp(2.2rem,4vw,3.4rem);line-height:1}
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.team{border-radius:var(--r);padding:18px;min-height:300px;transition:background .15s,box-shadow .15s}
.team.humans{background:linear-gradient(180deg,var(--candle-dim),var(--crypt) 220px);border:1px solid rgba(226,170,76,.35)}
.team.vampires{background:linear-gradient(180deg,var(--blood-dim),var(--crypt) 220px);border:1px solid rgba(196,32,58,.4)}
.team.drag-over{box-shadow:0 0 0 3px var(--bone)}
.team h2{font-size:2.4rem;line-height:1}
.team .meta{display:flex;justify-content:space-between;gap:8px;margin:12px 0 8px;flex-wrap:wrap}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 8px}
.tally div{background:rgba(5,4,8,.55);border-radius:8px;padding:7px 9px;display:flex;flex-direction:column;min-width:0}
.tally b{font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums;font-weight:600}
.tally .label{font-size:.75rem}
.rooms{display:flex;gap:4px;margin:6px 0 14px}
.rooms span{flex:1;font-family:var(--f-label);font-size:.78rem;text-align:center;padding:.3em .2em;border-radius:6px;background:rgba(5,4,8,.55);color:var(--ash);line-height:1.2;min-width:0}
.rooms span.done{color:var(--bone)}
.rooms em{display:block;font-style:normal;font-size:.72rem;opacity:.85;font-family:var(--f-body)}
.team.humans .rooms span.now{background:var(--candle);color:#20160a}
.team.vampires .rooms span.now{background:var(--blood);color:#fff}
.chips{display:flex;flex-direction:column;gap:6px;min-height:60px}
.chip{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(5,4,8,.5);border:1px solid var(--edge);border-radius:8px;padding:.45em .8em;cursor:grab;font-size:1.08rem;user-select:none}
.chip:active{cursor:grabbing}
.chip.picked{border-color:var(--bone)}
.chip small{color:var(--ash);font-family:var(--f-label);font-size:.8rem;white-space:nowrap}
.move-here{width:100%;margin-top:6px}
.team-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}

.altar{display:flex;flex-direction:column;gap:18px;min-width:0}
.tokens{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;background:var(--crypt);border-radius:var(--r);padding:18px}
.tok{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--bone)}
.eye{width:100%;max-width:72px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#e9e2d6 60%,#b9ad9c);
  border:3px solid #120f16;position:relative;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.5);transition:transform .15s;display:block}
.pupil{position:absolute;width:42%;height:42%;left:29%;top:29%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#555 0 8%,#0b0a0d 9%);transition:transform .08s linear}
.tok:hover .eye{transform:scale(1.07)}
.tok .num{font-family:var(--f-label);font-size:1.05rem;font-variant-numeric:tabular-nums}
.tok.sel .eye{box-shadow:0 0 0 3px var(--ember),0 0 22px var(--ember)}
.tok.sel .num{color:var(--ember)}
.tok.spent{cursor:default}
.tok.spent .eye::after{content:"";position:absolute;inset:0;background:linear-gradient(#3a3344 49%,#120f16 49% 54%,#3a3344 54%)}
.tok.cursed .eye::after{background:linear-gradient(#5b0f1c 49%,#120f16 49% 54%,#5b0f1c 54%)}
.tok.spent .num{color:var(--ash);text-decoration:line-through}

.console{background:var(--crypt);border:1px solid var(--edge);border-radius:var(--r);padding:18px 20px}
.console h3{font-size:1.9rem;margin-bottom:6px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.fgrid label{display:flex;flex-direction:column;gap:4px;min-width:0}
.fgrid .full{grid-column:1/-1}
.teampick{display:flex;gap:8px}
.teampick button{flex:1;border-radius:8px;padding:.5em;background:var(--night);border:1px solid var(--edge);font-family:var(--f-display);font-size:1.4rem}
.teampick button.on.humans{background:var(--candle);color:#20160a;border-color:var(--candle)}
.teampick button.on.vampires{background:var(--blood);color:#fff;border-color:var(--blood)}
.finders{display:flex;flex-direction:column;gap:6px}
.finders div{display:grid;grid-template-columns:4.5em 1fr;gap:8px;align-items:center}
.finders b{font-family:var(--f-label);font-weight:400;color:var(--ember);font-variant-numeric:tabular-nums}
.deal-desc{color:var(--ash);font-style:italic;min-height:1.5em}
.warn{color:var(--ember);font-size:.92rem}

.log{background:var(--crypt);border-radius:var(--r);padding:16px 18px;max-height:340px;overflow:auto}
.log h3{font-size:1.6rem;margin-bottom:6px}
.log ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;font-size:.95rem;border-bottom:1px solid var(--stone);padding-bottom:6px}
.log time{font-family:var(--f-label);color:var(--ash);font-variant-numeric:tabular-nums}
.log .rm{background:none;border:0;color:var(--ash);font-size:.8rem}
.log .rm.arm{color:var(--ember)}

/* ROOM BOXES on the board */
.vaults{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 14px}
.vbox{background:rgba(5,4,8,.55);border:1px solid var(--edge);border-radius:10px;padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--bone);min-width:0;transition:transform .15s,border-color .15s,box-shadow .15s}
.vbox:hover{transform:translateY(-2px);border-color:var(--ash)}
.vbox .ico{width:100%;max-width:64px;aspect-ratio:1;display:grid;place-items:center}
.vbox .ico img,.vbox .ico svg{width:100%;height:100%;object-fit:contain}
.vbox .rm-name{font-family:var(--f-label);font-size:.78rem;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.vbox .st{font-size:.72rem;color:var(--ash);font-family:var(--f-label);letter-spacing:.04em}
.vbox.locked{opacity:.42}
.vbox.done .st{color:var(--moss)}
.team.humans .vbox.now{border-color:var(--candle);box-shadow:0 0 18px rgba(226,170,76,.35)}
.team.vampires .vbox.now{border-color:var(--blood);box-shadow:0 0 18px rgba(196,32,58,.4)}

/* BOX SCREEN */
#vault{background:radial-gradient(ellipse at center,#241a2c,#050408 75%);overflow-x:hidden}
.vt{text-align:center;max-width:900px;width:100%}
.vt .who{font-family:var(--f-label);letter-spacing:.2em;color:var(--ash)}
.vt h2{font-size:clamp(2rem,4.5vw,3.4rem);margin:6px 0 0}
.chest{position:relative;width:min(340px,72vw);height:min(240px,50vw);margin:160px auto 26px;perspective:1000px}
.chest.zoom{animation:zoomin .55s cubic-bezier(.3,1.4,.5,1)}
@keyframes zoomin{from{transform:scale(.35);opacity:0}}
.chest .cbody{position:absolute;left:0;right:0;bottom:0;height:66%;z-index:3;border-radius:8px 8px 16px 16px;background:linear-gradient(#3d2618,#1f110a);border:4px solid var(--trim);box-shadow:0 30px 60px rgba(0,0,0,.65),inset 0 -20px 40px rgba(0,0,0,.5);display:grid;place-items:center}
.chest .cface{width:42%;height:76%;display:grid;place-items:center}
.chest .cface img,.chest .cface svg{max-width:100%;max-height:100%;object-fit:contain}
.chest .lid{position:absolute;left:-3%;right:-3%;bottom:62%;height:34%;z-index:4;border-radius:50% 50% 6px 6px/80% 80% 6px 6px;background:linear-gradient(#55341f,#2a170d);border:4px solid var(--trim);transform-origin:50% 100%;transition:transform 1.1s cubic-bezier(.5,-0.3,.3,1.2)}
.chest .lid::after{content:"";position:absolute;left:44%;right:44%;bottom:-4px;height:34%;background:var(--trim);border-radius:3px 3px 0 0}
.chest.open .lid{transform:translateY(-34%) rotateX(78deg)}
.chest.locked .cbody,.chest.locked .lid{filter:grayscale(.85) brightness(.6)}
.chest .cglow{position:absolute;left:-30%;right:-30%;bottom:20%;height:170%;z-index:1;background:radial-gradient(ellipse at 50% 70%,rgba(255,226,150,.75),rgba(255,180,80,.25) 35%,transparent 65%);opacity:0;transition:opacity 1s .4s;pointer-events:none}
.chest.open .cglow{opacity:1}
.chest .crays{position:absolute;left:50%;top:30%;width:900px;height:900px;margin:-450px 0 0 -450px;z-index:0;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,230,160,.18) 0deg 6deg,transparent 6deg 18deg);
  -webkit-mask-image:radial-gradient(circle,#000 8%,transparent 60%);mask-image:radial-gradient(circle,#000 8%,transparent 60%);opacity:0;transition:opacity 1.2s .6s;animation:spin 60s linear infinite}
.chest.open .crays{opacity:1}
.item3d{position:absolute;left:50%;bottom:30%;width:170px;height:170px;margin-left:-85px;z-index:2;perspective:700px;transform:translateY(70px) scale(.15);opacity:0;transition:transform 1.8s cubic-bezier(.2,.8,.2,1) .7s,opacity .6s .7s}
.chest.open .item3d{transform:translateY(-125px) scale(1);opacity:1}
.spin3d{position:absolute;inset:0;transform-style:preserve-3d;animation:spinY 7s linear infinite}
@keyframes spinY{from{transform:rotateX(-10deg) rotateY(0deg)}to{transform:rotateX(-10deg) rotateY(360deg)}}

<script>
(function(){
'use strict';

/* ---------- story ---------- */
const PAGES=[
 {title:'The Veil Grows Thin',text:'Every Halloween, the veil between the worlds grows thin. Tonight, two demons slipped through it, bored of eternity and hungry for a show. So they cast a curse on all blood.'},
 {title:'The Curse of Blood',text:'By sunrise, every human’s blood will turn to ash. And with no living blood left to drink, every vampire will starve. Neither will see another night.'},

/* ---------- illustrations (ink on parchment) ---------- */
const INK='#3a2414',RED='#8b1424',GOLD='#b8862e',PARCH='#e6d7b4';

function demon(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})" fill="${INK}">

const ILLUS=[
 ()=>{let s='';for(let x=24;x<=276;x+=18)s+=`<path d="M${x} 0C${x+14} 110 ${x-14} 230 ${x+4} 360" stroke="${INK}" stroke-opacity=".22" fill="none" stroke-width="1.3"/>`;
   return `<svg viewBox="0 0 300 360">${s}<circle cx="232" cy="64" r="30" fill="${GOLD}" opacity=".8"/><circle cx="245" cy="56" r="26" fill="${PARCH}"/>
   ${demon(98,175,1)}${demon(208,205,.78)}<path d="M0 335C60 320 120 345 180 330S280 340 300 330V360H0Z" fill="${INK}" opacity=".85"/></svg>`},
 ()=>{const r=rng(11);let ash='';for(let i=0;i<60;i++)ash+=`<circle cx="${(r()*300).toFixed(1)}" cy="${(r()*360).toFixed(1)}" r="${(0.8+r()*2.4).toFixed(1)}" fill="${INK}" opacity="${(0.15+r()*.45).toFixed(2)}"/>`;
   return `<svg viewBox="0 0 300 360">${glow('g1',RED)}<circle cx="150" cy="210" r="140" fill="url(#g1)" opacity=".35"/>${ash}
   <path d="M150 50C192 125 222 165 222 215a72 72 0 0 1-144 0C78 165 108 125 150 50Z" fill="${RED}"/>
   <path d="M122 160C114 186 116 212 130 230C110 218 104 190 122 160Z" fill="#f2c9b8" opacity=".55"/>
   <polyline points="152,92 164,140 140,172 160,206 146,252 156,286" fill="none" stroke="${PARCH}" stroke-width="3"/>
   <path d="M60 330h180" stroke="${INK}" stroke-width="2"/><path d="M110 330c0 12 8 18 8 18s8-6 8-18M175 330c0 8 6 12 6 12s6-4 6-12" fill="${RED}" opacity=".7"/></svg>`},
 ()=>{const r=rng(5);let f='';const feather=(i,side)=>{const a=(-28+i*12)*Math.PI/180,L=60+i*9;const cx=150+side*(14+Math.cos(a)*L/2),cy=150-Math.sin(a)*L/2;

   <div class="rv-toks">${ev.tokens.map((n,i)=>`<div class="card" id="rc${i}"><div class="in"><div class="f"><span class="eye"><span class="pupil"></span></span><span class="num">TOKEN ${String(n).padStart(2,'0')}</span></div><div class="b ${ev.results[i]?'cursed':'safe'}">${ev.results[i]?'Cursed':'Safe'}<span class="num">TOKEN ${String(n).padStart(2,'0')}</span></div></div></div>`).join('')}</div>
   <div class="verdict g${ev.cursed}" id="vd">${verdictText(ev.cursed)}</div>
   <div class="detail" id="vdet"></div><div class="resolve" id="vres"></div>`;
  ov.hidden=false;
  if(S.settings.voiceOn)speak('The demons consider your offer.');
  await sleep(1600);
  for(let i=0;i<ev.tokens.length;i++){$('#rc'+i).classList.add('flip');await sleep(700);sfx(ev.results[i]?'cursed':'safe');await sleep(600);if(ev.results[i])$('#rc'+i).classList.add('shake')}
  await sleep(400);$('#vd').classList.add('show');if(ev.cursed===2)sfx('doom');
  let det='';const res=$('#vres');const done=`<button class="btn primary" data-action="close-reveal">Done</button>`;
  if(!ev.convert){
    if(ev.cursed===0)det=esc(deal.desc);
    else if(ev.cursed===1)det=`${esc(deal.desc)} But ${esc(ev.twist)}`;
    else det=`The deal fails and the tokens are lost. And worse: ${esc(ev.twist)}`;
    res.innerHTML=done;
  }else{
    const to=ev.team,from=other(ev.team);const tn=P(ev.target);
    if(ev.cursed===0){det=`${esc(tn.name)} is turned and joins the ${TEAM[to].name}.`;movePlayer(tn.id,to,deal.name,ev.id);res.innerHTML=done}
    else if(ev.cursed===1){det=`${esc(tn.name)} must decide their own fate.`;res.innerHTML=`<button class="btn" data-action="fate" data-stay="1">${esc(tn.name)} stays with the ${TEAM[from].name}</button><button class="btn primary" data-action="fate" data-stay="0">${esc(tn.name)} joins the ${TEAM[to].name}</button>`;res.dataset.ev=ev.id}
    else{det=`The curse rebounds. The ${TEAM[from].name} take one of the ${TEAM[to].name}. Who do they take?`;
      res.innerHTML=teamOf(to).map(p=>`<button class="btn" data-action="rebound" data-pid="${p.id}">${esc(p.name)}</button>`).join('');res.dataset.ev=ev.id}
  }
  $('#vdet').innerHTML=det;
  if(S.settings.voiceOn)speak(verdictText(ev.cursed)+' '+$('#vdet').textContent)}
function movePlayer(pid,to,why,dealEv){const p=P(pid);if(!p||p.team===to)return;addLog({type:'convert',pid,from:p.team,to,why,dealEv:dealEv||null});p.team=to;save()}
function closeReveal(){$('#reveal').hidden=true;hush();rBoard()}

/* ---------- room boxes ---------- */
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
function vaultOf(ri,t){const v=S.settings.vaults[ri];return(v&&v[t])||{answer:'',clues:[]}}
function clueRoom(e){return e.ri!=null?e.ri:S.settings.rooms.indexOf(e.room)}
function codesFound(t,ri){const set=new Set();S.log.forEach(e=>{if(e.type==='clue'&&e.team===t&&e.ci!=null&&clueRoom(e)===ri)set.add(e.ci)});return set}
function chestSVG(t){const c=t==='humans'?'#e2aa4c':'#c4203a';
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="12" y="40" width="76" height="46" rx="5" fill="#2a1a12" stroke="${c}" stroke-width="3"/><path d="M12 42V32c0-12 10-20 22-20h32c12 0 22 8 22 20v10z" fill="#3a2418" stroke="${c}" stroke-width="3"/><path d="M30 13v73M70 13v73" stroke="${c}" stroke-width="3" opacity=".55"/><rect x="42" y="36" width="16" height="20" rx="3" fill="${c}"/><circle cx="50" cy="44" r="3" fill="#120f16"/><path d="M50 46v5" stroke="#120f16" stroke-width="2.5"/></svg>`}
const boxArt=(t,ri)=>{const k=`box-${t}-${ri}`;return ART[k]?`<img src="${ART[k]}" alt="">`:chestSVG(t)};
const LIGHT_SVG=`<svg viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="uvg"><stop offset="0" stop-color="#d4b0ff"/><stop offset="1" stop-color="#6a1fd1" stop-opacity="0"/></radialGradient></defs><circle cx="50" cy="20" r="22" fill="url(#uvg)"/><path d="M33 22h34l-7 19H40z" fill="#2b2433" stroke="#a49cab" stroke-width="2"/><rect x="40" y="41" width="20" height="50" rx="4" fill="#1d1824" stroke="#a49cab" stroke-width="2"/><ellipse cx="50" cy="22" rx="17" ry="4" fill="#b98cff"/><rect x="46" y="54" width="8" height="10" rx="2" fill="#7b3cff"/></svg>`;
function item3dHTML(ri){const src=ART['item-'+ri];const last=ri>=S.settings.rooms.length-1;
  const one=src?`<img src="${src}" alt="">`:last?`<svg viewBox="-44 -30 88 70" aria-hidden="true"><path d="${HEART}" fill="#c4203a" stroke="#f6c870" stroke-width="3"/></svg>`:LIGHT_SVG;
  let out='';const N=14;for(let i=0;i<N;i++){const z=((i-(N-1)/2)*1.3).toFixed(1);out+=`<div class="layer ${i===N-1?'front':i===0?'':'mid'}" style="transform:translateZ(${z}px)">${one}</div>`}
  return `<div class="spin3d">${out}</div>`}
function vaultTiles(t){const ph=S.phase[t];
  return `<div class="vaults">${S.settings.rooms.map((r,i)=>{const st=i<ph?'done':i===ph?'now':'locked';const total=vaultOf(i,t).clues.length,found=codesFound(t,i).size;
    const label=st==='done'?'Opened':st==='locked'?'Sealed':total?`${found}/${total} codes`:'Open now';
    return `<button class="vbox ${st}" data-action="vault" data-team="${t}" data-ri="${i}" aria-label="${esc(r)} box, ${label}"><span class="ico">${boxArt(t,i)}</span><span class="rm-name">${esc(r)}</span><span class="st">${label}</span></button>`}).join('')}</div>`}
function cheerText(t,ri){const rooms=S.settings.rooms,last=ri>=rooms.length-1,item=((S.settings.vaults[ri]||{}).item||'').trim();
  return last?`Team ${TEAM[t].name} opened the final box! ${item?'Inside lies '+item+'.':''}`:`Team ${TEAM[t].name} cleared the ${rooms[ri]}! They have now unlocked ${rooms[ri+1]}.${item?' Their reward: '+item+'.':''}`}
function cheerHTML(t,ri){const rooms=S.settings.rooms,last=ri>=rooms.length-1,item=((S.settings.vaults[ri]||{}).item||'').trim();
  const sub=last?(item?`Inside lies <b>${esc(item)}</b>.`:'The last seal is broken.'):`They have now unlocked <b>${esc(rooms[ri+1])}</b>.${item?` Their reward: <b>${esc(item)}</b>. They will need it there.`:''}`;
  const claim=last&&S.winner!==t?`<button class="btn primary" data-action="vault-claim">Claim the Heart for the ${TEAM[t].name}</button>`:'';
  return `<div class="cheer ${TEAM[t].cls}">${last?`Team ${TEAM[t].name} opened the final box!`:`Team ${TEAM[t].name} cleared the ${esc(rooms[ri])}!`}</div><p class="unlock">${sub}</p>
   <div class="row" style="justify-content:center;margin-top:18px">${claim}<button class="btn ${claim?'':'primary'}" data-action="close-vault">Done</button></div>`}
const advOf=(t,ri)=>S.log.slice().reverse().find(e=>e.type==='advance'&&e.team===t&&(e.ri!=null?e.ri:S.settings.rooms.indexOf(e.room))===ri);
function openVault(t,ri){const ph=S.phase[t],rooms=S.settings.rooms,st=ri<ph?'done':ri===ph?'now':'locked';UI.vault={t,ri,arm:false};
  let main;
  if(st==='locked')main=`<p class="unlock">This box stays sealed until the ${TEAM[t].name} open the ${esc(rooms[ph]||rooms[ri-1])} box.</p><div class="row" style="justify-content:center;margin-top:18px"><button class="btn primary" data-action="close-vault">Back to the hunt</button></div>`;
  else if(st==='done'){const adv=advOf(t,ri);main=cheerHTML(t,ri)+(adv?`<p class="label">Opened at ${hhmm(adv.t)}${adv.pid?' · answer by '+esc(nm(adv.pid)):''}</p>`:'')}
  else{const v=vaultOf(ri,t);
    main=`<form id="vt-form" class="vt-form" autocomplete="off"><input class="secret" type="password" id="vt-ans" autocomplete="new-password" placeholder="The answer" aria-label="The answer"><button class="btn primary" type="submit">Open the box</button></form>
    <div class="row" style="justify-content:center;margin-top:12px"><span class="label">Given by</span><select id="vt-p"><option value="">Whole team</option>${teamOf(t).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
    <div class="err" id="vt-err">${v.answer?'':'No answer is set for this box yet. Add it in the Deal Ledger, under Clues &amp; boxes.'}</div>
    <div class="row" style="justify-content:center;margin-top:6px"><button class="btn ghost small" data-action="close-vault">Cancel</button><button class="btn ghost small" data-action="vault-force" id="vt-force">Open it anyway</button></div>`}
  $('#vt').innerHTML=`<div class="who">THE ${TEAM[t].name.toUpperCase()} · ROOM ${['I','II','III','IV','V'][ri]||ri+1}</div><h2 class="${TEAM[t].cls}">The ${esc(rooms[ri])}</h2>
    <div class="chest ${st} ${st==='done'?'open':'zoom'}" id="chest" style="--trim:${t==='humans'?'#e2aa4c':'#c4203a'}"><div class="crays"></div><div class="cglow"></div><div class="item3d">${item3dHTML(ri)}</div><div class="lid"></div><div class="cbody"><div class="cface">${boxArt(t,ri)}</div></div></div>
    <div id="vt-main">${main}</div>`;
  const ov=$('#vault');ov.hidden=false;ov.scrollTop=0;
  if(st==='done')requestAnimationFrame(()=>{const c=$('#vt-main .cheer');if(c)c.classList.add('show')});
  const f=$('#vt-form');if(f){f.onsubmit=e=>{e.preventDefault();tryVault()};setTimeout(()=>{const a=$('#vt-ans');if(a)a.focus()},450)}}
function tryVault(){if(!UI.vault)return;const {t,ri}=UI.vault;const v=vaultOf(ri,t);const inp=$('#vt-ans');const a=inp.value;if(!a.trim())return;
  if(norm(v.answer)&&norm(a)===norm(v.answer)){unlockVault();return}
  const c=$('#chest');c.classList.remove('zoom','shake');void c.offsetWidth;c.classList.add('shake');sfx('deny');
  $('#vt-err').textContent=v.answer?pick(['The box stays sealed.','Wrong. The demons are laughing.','That is not the answer. Try again.']):'No answer is set for this box yet. Add it in the Deal Ledger, under Clues & boxes.';
  inp.value='';inp.focus()}
async function unlockVault(){if(!UI.vault)return;const {t,ri}=UI.vault;if(S.phase[t]!==ri)return;const sel=$('#vt-p');const pid=sel&&sel.value||null;
  addLog({type:'advance',team:t,room:S.settings.rooms[ri],ri,from:S.phase[t],pid});S.phase[t]=ri+1;save();
  $('#vt-main').innerHTML='';const c=$('#chest');c.classList.remove('zoom','shake','now');void c.offsetWidth;c.classList.add('open');sfx('unlock');
  await sleep(2300);if($('#vault').hidden||!UI.vault||UI.vault.t!==t||UI.vault.ri!==ri)return;
  $('#vt-main').innerHTML=cheerHTML(t,ri);requestAnimationFrame(()=>{const ch=$('#vt-main .cheer');if(ch)ch.classList.add('show')});sfx('dawn');
  if(S.settings.voiceOn)speak(cheerText(t,ri))}
function closeVault(){$('#vault').hidden=true;UI.vault=null;hush();if(S.screen==='board')rBoard()}

function playerSelect(id,team,whole){return `<select id="${id}" style="width:100%">${whole?'<option value="">Whole team</option>':''}${teamOf(team).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>`}
function clueModal(t){const len=S.settings.rooms.length;const ri=Math.min(S.phase[t],len-1);const room=S.settings.rooms[ri];const v=vaultOf(ri,t);const found=codesFound(t,ri);
  const by={};S.log.forEach(e=>{if(e.type==='clue'&&e.team===t&&e.ci!=null&&clueRoom(e)===ri)by[e.ci]=e.pid});

  ${v.clues.length?`<div class="cluepick">${v.clues.map((c,i)=>`<label class="${found.has(i)?'got':''}"><input type="radio" name="m-ci" value="${i}" ${i===first?'checked':''}><span><b>Clue ${i+1}</b> ${esc(c.clue||'')}${found.has(i)?` <em>· solved${by[i]?' by '+esc(nm(by[i])):''}</em>`:''}</span></label>`).join('')}</div>
    <div class="codebox"><span class="label">Hand over this piece</span><b id="m-code" class="masked">•••</b><button class="btn small" data-action="peek-code">Show</button></div>`

function ledger(){const st=S.settings;const mb=$('#modal-box');const keep=$('#modal').hidden?0:mb.scrollTop;const tab=UI.ltab||'deals';

const ACH={heart:['Heartbearer','gave the final answer'],keeper:['Keymaster','gave the answer that opened a box'],first:['First Blood','solved the first clue'],code:['Codebreaker','most clues solved'],hunter:['Token Hunter','found the most tokens'],
  cursed:['Cursed Soul','found the most cursed tokens'],lucky:['Lucky Devil','every token they found was safe'],snatch:['Soul Snatcher','turned an enemy'],turn:['Turncoat','switched sides once'],double:['Double Agent','switched sides twice or more'],untouched:['Untouched','never turned']};
function scores(){const start=S.log.find(e=>e.type==='start');const init=start?start.teams:{};
  const st={};S.players.forEach(p=>st[p.id]={p,init:init[p.id]||p.team,clues:0,tok:0,cursed:0,snatch:0,sw:0,bonus:0,notes:[],ach:[],heart:S.heartBy===p.id,boxes:0});
  const firstClue=S.log.find(e=>e.type==='clue'&&e.pid);
  S.log.forEach(e=>{
    if(e.type==='clue'&&st[e.pid])st[e.pid].clues++;
    if(e.type==='advance'&&st[e.pid])st[e.pid].boxes++;
    if(e.type==='deal')(e.finders||[]).forEach((f,i)=>{if(st[f]){st[f].tok++;if(e.results[i])st[f].cursed++}});
    if(e.type==='convert'&&st[e.pid]){st[e.pid].sw++;if(e.dealEv){const d=S.log.find(x=>x.id===e.dealEv);if(d&&d.target===e.pid)[...new Set((d.finders||[]).filter(Boolean))].forEach(f=>{if(st[f])st[f].snatch++})}}
    if(e.type==='bonus'&&st[e.pid]){st[e.pid].bonus+=Number(e.pts)||0;if(e.note)st[e.pid].notes.push(e.note)}});
  const arr=Object.values(st);
  const top=k=>Math.max(0,...arr.map(s=>s[k]));const mc=top('clues'),mt=top('tok'),mx=top('cursed');
  arr.forEach(s=>{
    if(s.heart)s.ach.push('heart');
    if(s.boxes)s.ach.push('keeper');
    if(firstClue&&firstClue.pid===s.p.id)s.ach.push('first');
    if(mc>=2&&s.clues===mc)s.ach.push('code');
    if(mt>=2&&s.tok===mt)s.ach.push('hunter');
    if(mx>=1&&s.cursed===mx)s.ach.push('cursed');
    if(s.tok>=2&&s.cursed===0)s.ach.push('lucky');
    if(s.snatch)s.ach.push('snatch');
    if(s.sw===1)s.ach.push('turn');if(s.sw>=2)s.ach.push('double');if(s.sw===0)s.ach.push('untouched');
    s.won=!!S.winner&&s.p.team===S.winner;
    s.pts=s.clues*3+s.tok+s.snatch*2+(s.sw===0?2:0)+(s.won?5:0)+(s.heart?3:0)+s.boxes*2+s.bonus;
    s.line=sentence(s)});
  arr.sort((a,b)=>b.pts-a.pts||a.p.name.localeCompare(b.p.name));
  let rank=0,prev=null;arr.forEach((s,i)=>{if(s.pts!==prev){rank=i+1;prev=s.pts}s.rank=rank});
  return arr}
function sentence(s){const parts=[];const one=t=>TEAM[t].one.toLowerCase();
  if(s.heart)parts.push('Brought in the final code and won the Heart of the Angel.');
  else if(s.boxes)parts.push(`Gave the answer that opened ${s.boxes===1?'a box':s.boxes+' boxes'}.`);
  if(s.sw>=2)parts.push(`Changed sides ${s.sw} times. Nobody trusts them now.`);
  else if(s.sw===1)parts.push(`Started the night a ${one(s.init)} and ended it a ${one(s.p.team)}.`);
  if(s.snatch)parts.push(`Turned ${s.snatch===1?'an enemy':s.snatch+' enemies'} with a demon's bargain.`);
  if(s.cursed>=2)parts.push(`Found ${s.cursed} cursed tokens. The demons adore them.`);
  else if(s.tok>=2)parts.push(`Found ${s.tok} tokens for the demons' table.`);
  if(s.clues>=2)parts.push(`Cracked ${s.clues} clues.`);else if(s.clues===1)parts.push('Cracked a clue for the team.');
  if(s.notes.length)parts.push(`The demons noted: ${s.notes[0]}.`);
  if(!parts.length)parts.push('Kept to the shadows and lived to see the end of the night.');
  return parts.slice(0,2).join(' ')}

    if(ev.type==='advance')S.phase[ev.team]=ev.from;
    if(ev.type==='convert'){const p=P(ev.pid);if(p)p.team=ev.from}
    if(ev.type==='win'){S.winner=null;S.heartBy=null}
    S.log=S.log.filter(x=>x.id!==id);save();rBoard();break}
  case 'ledger':UI.resetArm=false;ledger();break;
  case 'close-ledger':closeModal();render();break;
  case 'add-deal':S.settings.deals.push({id:uid(),name:'New deal',cost:1,team:'both',convert:false,desc:''});save();ledger();break;
  case 'rm-deal':S.settings.deals=S.settings.deals.filter(d=>d.id!==b.dataset.id);save();ledger();break;
  case 'rm-art':artDel(b.dataset.k).then(ledger);break;
  case 'test-voice':speak('Every deal has a price.');break;
  case 'copy-backup':{const txt=JSON.stringify(S);const done=m=>{$('#bk-msg').textContent=m};const fallback=()=>{$('#bk-in').value=txt;$('#bk-in').select();done('Select all and copy the text below.')};
    try{navigator.clipboard.writeText(txt).then(()=>done('Copied.'),fallback)}catch(err){fallback()}break}
  case 'restore':{try{const s=JSON.parse($('#bk-in').value);if(s&&s.settings&&s.players){S=s;migrate();save();closeModal();render()}else throw 0}catch(err){$('#bk-msg').textContent='That backup could not be read. Paste the whole text.'}break}
  case 'reset':if(!UI.resetArm){UI.resetArm=true;$('#reset-btn').textContent='Click again to wipe players, deals and the Chronicle';break}
    UI.resetArm=false;S=fresh(S.settings);save();closeModal();resetDeal();UI.picked=null;render();break;
  case 'fullscreen':try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(err){}break;
  case 'print':window.print();break;
  case 'save-cards':saveCards();break;
  }});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();else if(e.key==='Escape'&&!$('#vault').hidden)closeVault();
  if(S.screen==='grimoire'&&$('#modal').hidden&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){if(e.key==='ArrowRight'){hush();turn(1)}if(e.key==='ArrowLeft'){hush();turn(-1)}}});

/* drag & drop */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.chip');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.pid);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();document.querySelectorAll('.drag-over').forEach(x=>x!==z&&x.classList.remove('drag-over'));z.classList.add('drag-over')});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('drag-over')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();z.classList.remove('drag-over');handleDrop(e.dataTransfer.getData('text/plain'),z.dataset.drop)});
function handleDrop(pid,to){const p=P(pid);if(!p||p.team===to)return;
  if(S.screen==='setup'){p.team=to;save();rSetup();return}
  dropModal(pid,to)}

/* googly eyes follow the cursor */
let mx=innerWidth/2,my=innerHeight/2,eyeRAF=null;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;if(!eyeRAF)eyeRAF=requestAnimationFrame(moveEyes)});
function moveEyes(){eyeRAF=null;document.querySelectorAll('.eye').forEach(eye=>{const r=eye.getBoundingClientRect();if(!r.width)return;const cx=r.left+r.width/2,cy=r.top+r.height/2;
  const a=Math.atan2(my-cy,mx-cx),d=Math.min(r.width*.2,Math.hypot(mx-cx,my-cy)/8);const p=eye.firstElementChild;if(p)p.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`})}

render();
artLoad().then(()=>{if(Object.keys(ART).length)render()});
})();
</script>
